services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mshn
      POSTGRES_PASSWORD: mshn
      POSTGRES_DB: mshn
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mshn -d mshn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
